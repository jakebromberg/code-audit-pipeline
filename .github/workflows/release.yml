name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v6
        with:
          go-version: '1.24'
      - uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
        env:
          # GITHUB_TOKEN is auto-provided by Actions and covers the GitHub
          # Release artifacts on this repo. HOMEBREW_TAP_GITHUB_TOKEN is a
          # user-provisioned fine-grained PAT scoped to push to the separate
          # jakebromberg/homebrew-tap repository; goreleaser uses it to
          # update the formula. When absent, the brews step skips with a
          # warning rather than failing the release.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
