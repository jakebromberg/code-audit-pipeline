name: PR comment (reusable)

# Reusable workflow that sibling repos call to post a code-audit
# "structural impact" comment on every PR. Wraps the audit-pr-comment
# composite (#123) — the composite + reusable split is intentional and
# matches publish-catalog-reusable / audit-core: lower-level callers can
# `uses:` the composite directly; this workflow is the one-screen entry
# for the comment surface.

on:
  workflow_call:
    inputs:
      audit-binary-version:
        description: >-
          code-audit release tag to install. `v1`/`v2` resolve to the
          newest stable release of that major; `latest` to the newest
          release of any major; a fully-qualified `v1.2.3` is used
          verbatim. Whichever value is resolved is used for both the
          pipeline-source checkout AND the binary install so the
          composite's source tree and binary can't diverge.
        type: string
        required: false
        default: v1
      root:
        description: Repo root to scan. Defaults to the caller's checkout root.
        type: string
        required: false
        default: '.'
      languages:
        description: >-
          Comma-separated language override forwarded to the composite
          (e.g. `typescript,swift`). Empty means auto-detect from
          repo-root markers.
        type: string
        required: false
        default: ''
      include-tests:
        description: Pass --include-tests to every extractor.
        type: boolean
        required: false
        default: false
      include-file-hashes:
        description: >-
          Include the polyglot file-hashes extractor. Default true so
          touched-file matching has rows to intersect against for
          languages without a dedicated walker.
        type: boolean
        required: false
        default: true
      marker:
        description: >-
          Sticky comment marker. Forwarded to both `code-audit report
          --marker` and marocchino's `header:`. Default tracks the
          pipeline's v1 schema.
        type: string
        required: false
        default: code-audit-pipeline-v1
      size-cap-bytes:
        description: >-
          Hard cap on rendered comment body length. Default 60000
          leaves ~4KB headroom under GitHub's 65,536-character cap;
          minimum 1024 (enforced by `code-audit report`).
        type: number
        required: false
        default: 60000
      on-extraction-failure:
        description: >-
          `loud` exits non-zero on pipeline-internal failures; `quiet`
          (default) exits 0 with a diagnostic body so the comment
          surface stays current and the PR isn't blocked.
        type: string
        required: false
        default: quiet
      audit-root:
        description: >-
          Where audit-core places .audit/. Defaults to the runner temp
          directory so a misconfigured caller can't accidentally commit
          catalog files back to their repo.
        type: string
        required: false
        default: ''
      runner:
        description: >-
          Runner label for the comment job. Default ubuntu-latest. Repos
          containing Swift sources must override to macos-latest (Swift
          toolchain unavailable on the ubuntu runner image). A future
          iteration may split detection into a lightweight pre-job that
          picks the runner automatically.
        type: string
        required: false
        default: ubuntu-latest
      skip-comment:
        description: >-
          When true, render the comment body but skip the marocchino
          post step. Useful for dry-run / preview workflows.
        type: boolean
        required: false
        default: false
    outputs:
      comment-path:
        description: Absolute path to the rendered comment.md (on the runner filesystem).
        value: ${{ jobs.comment.outputs.comment-path }}
      touched-count:
        description: Number of repo-relative paths in the resolved touched set.
        value: ${{ jobs.comment.outputs.touched-count }}
      languages-detected:
        description: Comma-separated list of languages the composite ran extractors for.
        value: ${{ jobs.comment.outputs.languages-detected }}
      binary-version-used:
        description: Resolved code-audit release tag actually installed.
        value: ${{ jobs.comment.outputs.binary-version-used }}
      posted:
        description: >-
          `'true'` iff the marocchino sticky-comment step ran to success.
          `'false'` for skipped (non-PR event, fork PR with read-only token,
          `skip-comment: true`) AND for marocchino failures. Consumers
          wanting CI to redden on fork PRs can branch on
          `outputs.posted == 'false' && outputs.exit-code == '0'`.
        value: ${{ jobs.comment.outputs.posted }}
      exit-code:
        description: Exit code from `code-audit report --mode pr-comment` (0 in quiet mode; 0/1 in loud mode).
        value: ${{ jobs.comment.outputs.exit-code }}

# `contents: read` for checkout. `pull-requests: write` for the marocchino
# sticky-comment poster — required even when editing an existing comment.
# Callers must grant both; the reusable's permissions block is an upper
# bound, not a request.
permissions:
  contents: read
  pull-requests: write

# Concurrency at the workflow level so rapid force-pushes don't pile up:
# the in-flight run for the PR is cancelled when a new push lands, and
# the latest push's run is what produces the comment. marocchino's
# sticky-comment behavior means the final comment converges to the
# latest-push state regardless of mid-run cancellations.
# `|| github.run_id` is the fallback so non-pull_request invocations (a
# consumer wiring this into workflow_dispatch for preview/debug, or into
# push for a main-branch run) don't collapse into a single global slot
# called `code-audit-pr-comment-` that cancels every other run regardless
# of PR. github.run_id is unique per-run so it effectively disables
# cross-run cancellation on non-PR triggers — correct behavior given the
# concurrency rationale (force-push coalescing) only makes sense for PRs.
concurrency:
  group: code-audit-pr-comment-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  comment:
    # Skip draft PRs by default. `draft != true` (not `draft == false`):
    # when `pull_request` is null on non-PR triggers, `null == false` is
    # *false* in GHA — the job would silently skip with no log explaining
    # why. `null != true` is *true*, so non-PR invocations proceed through
    # this gate and are stopped by the downstream step-level `if:` guards
    # (e.g. the marocchino post step), which surface the no-op explicitly.
    if: github.event.pull_request.draft != true
    runs-on: ${{ inputs.runner }}
    outputs:
      comment-path: ${{ steps.render.outputs.comment-path }}
      touched-count: ${{ steps.touched.outputs.count }}
      languages-detected: ${{ steps.audit.outputs.languages-detected }}
      binary-version-used: ${{ steps.audit.outputs.binary-version-used }}
      posted: ${{ steps.post.outcome == 'success' }}
      exit-code: ${{ steps.render.outputs.exit-code }}
    steps:
      - name: Resolve audit-pr-comment ref
        # Resolve `latest` and major-pins (`v1`/`v2`) to a concrete release
        # tag here so the SAME tag drives both the pipeline-source checkout
        # below and the composite's binary install. Without this resolution:
        # actions/checkout with `ref: latest` 404s (no such git ref), and
        # `ref: v1` pulls the floating major-series tag which may lag the
        # latest v1.x.y release — producing split-brain runs where the
        # composite's source tree and binary come from different releases.
        id: ref
        shell: bash
        env:
          BINARY_VERSION: ${{ inputs.audit-binary-version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          version="$BINARY_VERSION"

          if [ "$version" = "build-from-source" ]; then
            echo "pr-comment-reusable: audit-binary-version=build-from-source is only valid for this repo's own CI, not for sibling consumers." >&2
            exit 1
          fi

          pipeline_repo="jakebromberg/code-audit-pipeline"
          if [ "$version" = "latest" ]; then
            resolved="$(gh release list --repo "$pipeline_repo" \
              --limit 100 --json tagName --jq \
              '.[] | .tagName | select(contains("-") | not)' \
              | sort -V | tail -1)"
            if [ -z "$resolved" ]; then
              echo "pr-comment-reusable: no stable releases found on $pipeline_repo" >&2
              exit 1
            fi
          elif echo "$version" | grep -Eq '^v[0-9]+$'; then
            major="${version#v}"
            resolved="$(gh release list --repo "$pipeline_repo" \
              --limit 100 --json tagName --jq \
              '.[] | .tagName | select(startswith("v'"$major"'.") and (contains("-") | not))' \
              | sort -V | tail -1)"
            if [ -z "$resolved" ]; then
              echo "pr-comment-reusable: no stable v${major}.* releases found on $pipeline_repo" >&2
              exit 1
            fi
          else
            resolved="$version"
          fi

          echo "Resolved audit-binary-version=$version → $resolved" >&2
          echo "ref=$resolved" >> "$GITHUB_OUTPUT"

      - name: Checkout caller repo (PR HEAD)
        uses: actions/checkout@v6
        with:
          # PR HEAD, not the merge commit. The merge commit doesn't exist
          # for draft / unmerged PRs and the rendered comment should
          # reflect what the contributor pushed, not GitHub's synthetic
          # merge preview.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Checkout code-audit-pipeline (composite source)
        uses: actions/checkout@v6
        with:
          repository: jakebromberg/code-audit-pipeline
          ref: ${{ steps.ref.outputs.ref }}
          path: .code-audit-pipeline
          fetch-depth: 1

      # The steps below mirror the audit-pr-comment composite's body, inlined
      # at workflow level because GHA composites resolve `uses: ./X` against
      # GITHUB_WORKSPACE (the caller's repo root) — NOT the composite's own
      # location. The composite's nested `uses: ./.github/actions/audit-core`
      # therefore 404s the moment an external consumer invokes it via this
      # reusable. The selftest still drives the composite directly (where
      # workspace IS the pipeline, so the relative path resolves), so the
      # composite stays intact for that path. Follow-up: refactor the
      # composite to accept audit-core's outputs as inputs, eliminating this
      # duplication.

      - name: Derive paths
        id: paths
        shell: bash
        env:
          AUDIT_PR_AUDIT_ROOT_INPUT: ${{ inputs.audit-root }}
          RUNNER_TEMP_DIR: ${{ runner.temp }}
        run: |
          set -Eeuo pipefail
          if [ -n "$AUDIT_PR_AUDIT_ROOT_INPUT" ]; then
            audit_root="$AUDIT_PR_AUDIT_ROOT_INPUT"
          else
            audit_root="${RUNNER_TEMP_DIR}/audit"
          fi
          echo "audit-root=$audit_root" >> "$GITHUB_OUTPUT"

      - name: Run audit-core (HEAD catalogs)
        id: audit
        # Full `./.code-audit-pipeline/...` path resolves correctly against
        # the caller's workspace because the pipeline checkout above placed
        # the action there.
        uses: ./.code-audit-pipeline/.github/actions/audit-core
        with:
          root: ${{ inputs.root }}
          languages: ${{ inputs.languages }}
          # Pass the resolved concrete tag so audit-core doesn't re-resolve
          # and risk diverging from the pipeline checkout above.
          binary-version: ${{ steps.ref.outputs.ref }}
          include-tests: ${{ inputs.include-tests }}
          include-file-hashes: ${{ inputs.include-file-hashes }}
          audit-root: ${{ steps.paths.outputs.audit-root }}
          github-token: ${{ github.token }}

      - name: Resolve touched files
        id: touched
        shell: bash
        env:
          # The composite uses $github.action_path/../../.. to find the
          # pipeline root; at workflow level the pipeline checkout sits at a
          # known path under the workspace.
          PIPELINE_ROOT: ${{ github.workspace }}/.code-audit-pipeline
          AUDIT_PR_LANGS: ${{ steps.audit.outputs.languages-detected }}
          AUDIT_PR_INCLUDE_TESTS: ${{ inputs.include-tests }}
          AUDIT_PR_AUDIT_ROOT: ${{ steps.paths.outputs.audit-root }}
          # PR number is empty for non-pull_request events; in that case
          # resolve-touched.sh fails loud (we explicitly support only the
          # PR-comment surface, which is pull_request-scoped).
          AUDIT_PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          mkdir -p "$AUDIT_PR_AUDIT_ROOT"
          touched_path="$AUDIT_PR_AUDIT_ROOT/touched.json"

          PR_NUMBER="$AUDIT_PR_NUMBER" \
          LANGUAGES_DETECTED="$AUDIT_PR_LANGS" \
          EXTRACTORS_DIR="$PIPELINE_ROOT/extractors" \
          INCLUDE_TESTS="$AUDIT_PR_INCLUDE_TESTS" \
          OUTPUT_PATH="$touched_path" \
            bash "$PIPELINE_ROOT/.github/actions/audit-pr-comment/scripts/resolve-touched.sh"

          count="$(jq 'length' "$touched_path")"
          echo "audit-pr-comment: touched-count=$count" >&2
          echo "touched-path=$touched_path" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

      - name: Render PR comment
        id: render
        shell: bash
        env:
          AUDIT_PR_AUDIT_ROOT: ${{ steps.paths.outputs.audit-root }}
          AUDIT_PR_TOUCHED: ${{ steps.touched.outputs.touched-path }}
          AUDIT_PR_MARKER: ${{ inputs.marker }}
          AUDIT_PR_SIZE_CAP: ${{ inputs.size-cap-bytes }}
          AUDIT_PR_ON_FAILURE: ${{ inputs.on-extraction-failure }}
          AUDIT_PR_LANGS: ${{ steps.audit.outputs.languages-detected }}
        run: |
          set -Eeuo pipefail
          comment_path="$AUDIT_PR_AUDIT_ROOT/comment.md"
          set +e
          code-audit report \
            --root "$AUDIT_PR_AUDIT_ROOT" \
            --touched "$AUDIT_PR_TOUCHED" \
            --mode pr-comment \
            --marker "$AUDIT_PR_MARKER" \
            --size-cap-bytes "$AUDIT_PR_SIZE_CAP" \
            --on-extraction-failure "$AUDIT_PR_ON_FAILURE" \
            --detected-languages "$AUDIT_PR_LANGS" \
            --output "$comment_path"
          exit_code=$?
          set -e

          if [ ! -s "$comment_path" ]; then
            # Defensive fallback: if --output produced an empty file, synthesize
            # a minimal marker-body so marocchino still posts an updateable
            # comment.
            {
              printf '<!-- %s -->\n\n' "$AUDIT_PR_MARKER"
              printf '> code-audit: report unavailable (renderer exited %d before producing output); see workflow run logs.\n' "$exit_code"
            } > "$comment_path"
          fi

          echo "audit-pr-comment: rendered $(wc -c < "$comment_path" | tr -d ' ') bytes to $comment_path" >&2
          echo "comment-path=$comment_path" >> "$GITHUB_OUTPUT"
          echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
          if [ "$AUDIT_PR_ON_FAILURE" = "loud" ] && [ "$exit_code" -ne 0 ]; then
            echo "audit-pr-comment: render exited $exit_code (on-extraction-failure=loud)" >&2
            exit "$exit_code"
          fi

      - name: Post sticky comment
        id: post
        # `github.event_name == 'pull_request'` is the load-bearing gate.
        # The natural-looking `pull_request.number != ''` is unsafe: when
        # invoked from a non-pull_request event, `pull_request` is null and
        # `null != ''` evaluates true in GHA expressions — the step would
        # then post to a wrong issue or fail loud. Pair both checks plus
        # the explicit `skip-comment` opt-out.
        if: inputs.skip-comment != 'true' && github.event_name == 'pull_request' && github.event.pull_request.number != ''
        # `continue-on-error: true` so fork PRs don't redden the consumer's
        # CI. Fork-raised pull_request events carry a read-only GITHUB_TOKEN
        # without `pull-requests: write`; marocchino exits 1 with "Resource
        # not accessible by integration" and we want the surrounding
        # workflow to stay green.
        continue-on-error: true
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          # marocchino's `header:` is a substring match against the body.
          # Forward the same value to both `header` here and the rendered
          # body's `<!-- <marker> -->` first line so future runs edit in
          # place instead of stacking new comments.
          header: ${{ inputs.marker }}
          path: ${{ steps.render.outputs.comment-path }}
          GITHUB_TOKEN: ${{ github.token }}

      - name: Upload comment artifact
        # Always upload — even on render-failure paths the artifact carries
        # the fail-quiet body (or the defensive fallback), which is the
        # primary debug signal for "why didn't my comment look right."
        if: always() && steps.render.outputs.comment-path != ''
        uses: actions/upload-artifact@v4
        with:
          name: code-audit-pr-comment
          path: ${{ steps.render.outputs.comment-path }}
          retention-days: 14
          if-no-files-found: warn

      - name: Emit step summary
        # `always()` so the diagnostic summary renders on loud-mode render
        # failures and on marocchino 403s — exactly the cases where the
        # summary's languages/touched-count/exit-code/comment-file context
        # is most useful for debugging.
        if: always()
        shell: bash
        env:
          AUDIT_PR_COMMENT_PATH: ${{ steps.render.outputs.comment-path }}
          AUDIT_PR_TOUCHED_COUNT: ${{ steps.touched.outputs.count }}
          AUDIT_PR_LANGS: ${{ steps.audit.outputs.languages-detected }}
          AUDIT_PR_EXIT: ${{ steps.render.outputs.exit-code }}
          AUDIT_PR_BIN_VERSION: ${{ steps.audit.outputs.binary-version-used }}
          AUDIT_PR_POSTED: ${{ steps.post.outcome }}
        run: |
          set -Eeuo pipefail
          {
            echo "## code-audit PR comment"
            echo ""
            echo "| key | value |"
            echo "| --- | --- |"
            echo "| Languages detected | \`${AUDIT_PR_LANGS:-<none>}\` |"
            echo "| Binary version | \`${AUDIT_PR_BIN_VERSION:-<unknown>}\` |"
            echo "| Touched paths | \`${AUDIT_PR_TOUCHED_COUNT:-0}\` |"
            echo "| Render exit | \`${AUDIT_PR_EXIT:-?}\` |"
            echo "| Sticky post | \`${AUDIT_PR_POSTED:-skipped}\` |"
            echo "| Comment file | \`${AUDIT_PR_COMMENT_PATH:-<none>}\` |"
            echo ""
            if [ -s "$AUDIT_PR_COMMENT_PATH" ]; then
              echo "<details><summary>Rendered comment</summary>"
              echo ""
              echo '```markdown'
              cat "$AUDIT_PR_COMMENT_PATH"
              echo '```'
              echo "</details>"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
