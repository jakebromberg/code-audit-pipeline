name: audit-pr-comment
description: >-
  Run code-audit against the PR's HEAD checkout, resolve the touched-file
  set, render a structural-impact comment via `code-audit report --mode
  pr-comment`, and post (or edit-in-place) a sticky comment on the PR.
  Wraps the audit-core composite plus `code-audit report` plus the
  marocchino sticky-comment poster. See docs/integrations/github-action.md
  for the setup walk-through.

  Caller is responsible for the `actions/checkout` step (this composite
  expects the PR's HEAD already at $GITHUB_WORKSPACE) and for granting the
  job `pull-requests: write` so the marocchino poster can edit the comment.

inputs:
  root:
    description: Repo root to scan. Forwarded to audit-core's `root` input.
    required: false
    default: '.'
  audit-binary-version:
    description: >-
      code-audit release tag to install. Same resolution semantics as
      audit-core's input: `v1` (major-pin), `latest`, `v1.2.3` (exact), or
      `build-from-source` (only valid for this repo's own selftest).
    required: false
    default: 'v1'
  languages:
    description: >-
      Comma-separated language override forwarded to audit-core. Empty
      means auto-detect from markers at the repo root.
    required: false
    default: ''
  include-tests:
    description: Pass --include-tests to every extractor invocation.
    required: false
    default: 'false'
  include-file-hashes:
    description: >-
      Forwarded to audit-core. Keep at `true` so file-hashes catalog rows
      participate in touched-file matching for languages without a
      dedicated walker.
    required: false
    default: 'true'
  marker:
    description: >-
      Sticky comment marker. Forwarded to both `code-audit report --marker`
      and marocchino's `header:`. Default tracks the pipeline's v1 schema
      so a future v2 marker doesn't accidentally edit-over old v1 comments.
    required: false
    default: 'code-audit-pipeline-v1'
  size-cap-bytes:
    description: >-
      Hard cap on rendered comment body length. Default 60000 leaves ~4KB
      headroom under GitHub's 65,536-character PR comment cap. Minimum
      1024 (enforced by `code-audit report`).
    required: false
    default: '60000'
  on-extraction-failure:
    description: >-
      `loud` exits non-zero on pipeline-internal failures (extractor crash,
      query bug, render error). `quiet` exits 0 with a single-line
      diagnostic body so the comment surface stays current and the PR
      isn't blocked. Default `quiet` matches the pr-comment-mode default
      in `code-audit report`.
    required: false
    default: 'quiet'
  audit-root:
    description: >-
      Where audit-core places .audit/. Defaults to the runner temp dir so
      a misconfigured caller can't accidentally commit catalog files into
      their repo.
    required: false
    default: ''
  github-token:
    description: >-
      Token used by audit-core's `gh release download` and by the
      marocchino sticky-comment poster. Defaults to the workflow's
      GITHUB_TOKEN, which works for public repos and same-repo PRs.
      Forks raising PRs against the base repo do NOT receive a token
      with `pull-requests: write` — the marocchino step will skip
      gracefully (see "Forks" in the setup doc).
    required: false
    default: ${{ github.token }}
  skip-comment:
    description: >-
      When `true`, render the comment.md artifact but skip the marocchino
      post step. Useful for dry-run / preview workflows and for the
      selftest's "render-only" job. Defaults to `false`.
    required: false
    default: 'false'

outputs:
  comment-path:
    description: Absolute path to the rendered comment.md.
    value: ${{ steps.render.outputs.comment-path }}
  touched-count:
    description: Number of repo-relative paths in the resolved touched set.
    value: ${{ steps.touched.outputs.count }}
  posted:
    description: >-
      `'true'` iff the marocchino sticky-comment step ran to success. Derived
      from `steps.post.outcome` because marocchino itself does not declare a
      `posted` output — `outcome` is GHA's built-in success/skipped/failure
      classification, which is what consumers actually want.
    value: ${{ steps.post.outcome == 'success' }}
  exit-code:
    description: The exit code from `code-audit report --mode pr-comment` (0/1/2).
    value: ${{ steps.render.outputs.exit-code }}
  languages-detected:
    description: Comma-separated languages audit-core ran extractors for. Forwarded from audit-core's output.
    value: ${{ steps.audit.outputs.languages-detected }}
  binary-version-used:
    description: Resolved code-audit release tag actually installed. Forwarded from audit-core's output.
    value: ${{ steps.audit.outputs.binary-version-used }}

runs:
  using: composite
  steps:
    - name: Validate inputs
      # `build-from-source` is reserved for this repo's own selftest — it
      # makes audit-core invoke `go build` against `$AUDIT_CORE_ACTION_PATH/../../..`,
      # which only resolves to a valid Go module when the composite was
      # checked out from the pipeline repo. A sibling consumer passing this
      # value would hit a confusing `go: cannot find main module` error or
      # silently build against an unrelated module if the caller's repo is
      # also a Go repo. Reject early with a clear message; the reusable
      # workflow has the same guard, but direct-composite callers bypass it.
      shell: bash
      env:
        AUDIT_PR_BINARY_VERSION: ${{ inputs.audit-binary-version }}
        AUDIT_PR_ACTION_REPO: ${{ github.action_repository }}
      run: |
        set -Eeuo pipefail
        if [ "$AUDIT_PR_BINARY_VERSION" = "build-from-source" ] && [ -n "$AUDIT_PR_ACTION_REPO" ]; then
          # action_repository is set only when this composite was loaded
          # from a remote repo via `uses: owner/repo/.../audit-pr-comment@v1`;
          # it's empty for local `uses: ./...` references (the in-repo
          # selftest path), which is exactly the case where build-from-source
          # is valid.
          echo "audit-pr-comment: audit-binary-version=build-from-source is only valid for in-repo selftest invocations (action_repository=$AUDIT_PR_ACTION_REPO)" >&2
          exit 1
        fi

    - name: Derive paths
      id: paths
      # Single source of truth for audit-root. Three downstream steps need
      # the same value; computing it once here (and reading it via
      # `steps.paths.outputs.audit-root` everywhere) prevents the
      # duplicated-expression footgun where a future contributor changes
      # the default in one place but misses the others, silently splitting
      # the catalog-write path from the catalog-read path.
      shell: bash
      env:
        AUDIT_PR_AUDIT_ROOT_INPUT: ${{ inputs.audit-root }}
        RUNNER_TEMP_DIR: ${{ runner.temp }}
      run: |
        set -Eeuo pipefail
        if [ -n "$AUDIT_PR_AUDIT_ROOT_INPUT" ]; then
          audit_root="$AUDIT_PR_AUDIT_ROOT_INPUT"
        else
          audit_root="${RUNNER_TEMP_DIR}/audit"
        fi
        echo "audit-root=$audit_root" >> "$GITHUB_OUTPUT"

    - name: Run audit-core (HEAD catalogs)
      id: audit
      uses: ./.github/actions/audit-core
      with:
        root: ${{ inputs.root }}
        languages: ${{ inputs.languages }}
        binary-version: ${{ inputs.audit-binary-version }}
        include-tests: ${{ inputs.include-tests }}
        include-file-hashes: ${{ inputs.include-file-hashes }}
        audit-root: ${{ steps.paths.outputs.audit-root }}
        github-token: ${{ inputs.github-token }}

    - name: Resolve touched files
      id: touched
      shell: bash
      env:
        AUDIT_PR_ACTION_PATH: ${{ github.action_path }}
        AUDIT_PR_LANGS: ${{ steps.audit.outputs.languages-detected }}
        AUDIT_PR_INCLUDE_TESTS: ${{ inputs.include-tests }}
        AUDIT_PR_AUDIT_ROOT: ${{ steps.paths.outputs.audit-root }}
        # PR number is empty for non-pull_request events; in that case
        # resolve-touched.sh fails loud (we explicitly support only the
        # PR-comment surface, which is pull_request-scoped).
        AUDIT_PR_NUMBER: ${{ github.event.pull_request.number }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -Eeuo pipefail
        # The action's source tree carries the extractors directory at
        # ../../extractors/ relative to .github/actions/audit-pr-comment/.
        # Resolve once and pass via env so the script doesn't need to know
        # about GHA's action_path layout.
        pipeline_root="$(cd "$AUDIT_PR_ACTION_PATH/../../.." && pwd)"
        extractors_dir="$pipeline_root/extractors"

        mkdir -p "$AUDIT_PR_AUDIT_ROOT"
        touched_path="$AUDIT_PR_AUDIT_ROOT/touched.json"

        PR_NUMBER="$AUDIT_PR_NUMBER" \
        LANGUAGES_DETECTED="$AUDIT_PR_LANGS" \
        EXTRACTORS_DIR="$extractors_dir" \
        INCLUDE_TESTS="$AUDIT_PR_INCLUDE_TESTS" \
        OUTPUT_PATH="$touched_path" \
          bash "$AUDIT_PR_ACTION_PATH/scripts/resolve-touched.sh"

        # jq length on the produced file — cheap sanity output for the
        # workflow log AND a step output the consumer can gate jobs on.
        count="$(jq 'length' "$touched_path")"
        echo "audit-pr-comment: touched-count=$count" >&2
        echo "touched-path=$touched_path" >> "$GITHUB_OUTPUT"
        echo "count=$count" >> "$GITHUB_OUTPUT"

    - name: Render PR comment
      id: render
      shell: bash
      env:
        AUDIT_PR_AUDIT_ROOT: ${{ steps.paths.outputs.audit-root }}
        AUDIT_PR_TOUCHED: ${{ steps.touched.outputs.touched-path }}
        AUDIT_PR_MARKER: ${{ inputs.marker }}
        AUDIT_PR_SIZE_CAP: ${{ inputs.size-cap-bytes }}
        AUDIT_PR_ON_FAILURE: ${{ inputs.on-extraction-failure }}
        AUDIT_PR_LANGS: ${{ steps.audit.outputs.languages-detected }}
      run: |
        set -Eeuo pipefail
        comment_path="$AUDIT_PR_AUDIT_ROOT/comment.md"
        # `code-audit report` reads .audit/ via --root; pass the same
        # audit-root the audit-core step wrote into. --output goes to a
        # known path so the marocchino step can pick it up regardless of
        # which working directory code-audit ended up running from.
        # Capture exit code separately so a non-zero exit in loud mode
        # still surfaces the comment body for the marocchino step.
        set +e
        code-audit report \
          --root "$AUDIT_PR_AUDIT_ROOT" \
          --touched "$AUDIT_PR_TOUCHED" \
          --mode pr-comment \
          --marker "$AUDIT_PR_MARKER" \
          --size-cap-bytes "$AUDIT_PR_SIZE_CAP" \
          --on-extraction-failure "$AUDIT_PR_ON_FAILURE" \
          --detected-languages "$AUDIT_PR_LANGS" \
          --output "$comment_path"
        exit_code=$?
        set -e

        if [ ! -s "$comment_path" ]; then
          # Defensive fallback: if --output produced an empty file (e.g.
          # the binary errored before the writeAtomic call), synthesize a
          # minimal marker-body so marocchino still posts an updateable
          # comment. The "report unavailable" wording matches failQuietBody.
          {
            printf '<!-- %s -->\n\n' "$AUDIT_PR_MARKER"
            printf '> code-audit: report unavailable (renderer exited %d before producing output); see workflow run logs.\n' "$exit_code"
          } > "$comment_path"
        fi

        echo "audit-pr-comment: rendered $(wc -c < "$comment_path" | tr -d ' ') bytes to $comment_path" >&2
        echo "comment-path=$comment_path" >> "$GITHUB_OUTPUT"
        echo "exit-code=$exit_code" >> "$GITHUB_OUTPUT"
        # Honor loud-mode failures by propagating the exit code. quiet-mode
        # always returns 0, so this branch only fires for explicit loud.
        if [ "$AUDIT_PR_ON_FAILURE" = "loud" ] && [ "$exit_code" -ne 0 ]; then
          echo "audit-pr-comment: render exited $exit_code (on-extraction-failure=loud)" >&2
          exit "$exit_code"
        fi

    - name: Post sticky comment
      id: post
      # `github.event_name == 'pull_request'` is the load-bearing gate. The
      # natural-looking `pull_request.number != ''` is unsafe: when the
      # composite is invoked from a non-pull_request event (push,
      # workflow_dispatch, schedule), `pull_request` is null and
      # `null != ''` evaluates to **true** in GHA expressions — the step
      # would run unconditionally on every non-PR event and either fail
      # loud or post to a wrong issue. Pair both checks: event type AND
      # number-present, plus the explicit `skip-comment` opt-out.
      if: inputs.skip-comment != 'true' && github.event_name == 'pull_request' && github.event.pull_request.number != ''
      # `continue-on-error: true` so fork PRs don't redden the consumer's CI.
      # A `pull_request` event raised from a fork carries a read-only
      # GITHUB_TOKEN that lacks `pull-requests: write`; marocchino exits 1
      # with "Resource not accessible by integration" and — without this
      # guard — the whole composite would fail loud. Documented contract in
      # both this composite's README and docs/integrations/github-action.md
      # says fork PRs "skip gracefully"; the `posted` output (which reads
      # `steps.post.outcome`) lets callers detect the no-op when they care.
      continue-on-error: true
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        # marocchino's `header:` is a substring match against the body. The
        # `--marker` rendered into the body's first line as `<!-- <marker> -->`
        # is the canonical sticky-identifier; mismatched values here would
        # cause every run to create a new comment instead of editing in
        # place. Forward the same input to both.
        header: ${{ inputs.marker }}
        path: ${{ steps.render.outputs.comment-path }}
        GITHUB_TOKEN: ${{ inputs.github-token }}

    - name: Emit step summary
      # `always()` so the diagnostic summary renders on loud-mode render
      # failures and on marocchino 403s — exactly the cases where the
      # summary's languages/touched-count/exit-code/comment-file context is
      # most useful for debugging.
      if: always()
      shell: bash
      env:
        AUDIT_PR_COMMENT_PATH: ${{ steps.render.outputs.comment-path }}
        AUDIT_PR_TOUCHED_COUNT: ${{ steps.touched.outputs.count }}
        AUDIT_PR_LANGS: ${{ steps.audit.outputs.languages-detected }}
        AUDIT_PR_EXIT: ${{ steps.render.outputs.exit-code }}
        AUDIT_PR_BIN_VERSION: ${{ steps.audit.outputs.binary-version-used }}
        AUDIT_PR_POSTED: ${{ steps.post.outcome }}
      run: |
        set -Eeuo pipefail
        {
          echo "## code-audit PR comment"
          echo ""
          echo "| key | value |"
          echo "| --- | --- |"
          echo "| Languages detected | \`${AUDIT_PR_LANGS:-<none>}\` |"
          echo "| Binary version | \`${AUDIT_PR_BIN_VERSION:-<unknown>}\` |"
          echo "| Touched paths | \`${AUDIT_PR_TOUCHED_COUNT:-0}\` |"
          echo "| Render exit | \`${AUDIT_PR_EXIT:-?}\` |"
          echo "| Sticky post | \`${AUDIT_PR_POSTED:-skipped}\` |"
          echo "| Comment file | \`${AUDIT_PR_COMMENT_PATH:-<none>}\` |"
          echo ""
          if [ -s "$AUDIT_PR_COMMENT_PATH" ]; then
            echo "<details><summary>Rendered comment</summary>"
            echo ""
            echo '```markdown'
            cat "$AUDIT_PR_COMMENT_PATH"
            echo '```'
            echo "</details>"
          fi
        } >> "$GITHUB_STEP_SUMMARY"
