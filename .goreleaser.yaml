# goreleaser config for the `code-audit` binary. Driven by tag push on the
# release workflow (.github/workflows/release.yml). See plans/pr4-renderers-report-init.md.
version: 2

project_name: code-audit

before:
  hooks:
    - go generate ./...

builds:
  - id: code-audit
    main: ./cmd/code-audit
    binary: code-audit
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w
      - -X github.com/jakebromberg/code-audit-pipeline/internal/cli.Version={{.Version}}

archives:
  - id: code-audit
    formats: [tar.gz]
    name_template: >-
      code-audit_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

# goreleaser v2.10+ deprecated `brews:` in favor of `homebrew_casks:`; the cask
# path ships pre-compiled binaries from the GitHub release rather than building
# from source, which matches the artifacts the binary already produces.
homebrew_casks:
  - name: code-audit
    repository:
      owner: jakebromberg
      name: homebrew-tap
      # The default GITHUB_TOKEN can't write to the separate tap repo (403
      # Resource not accessible by integration). Pin to the user-provisioned
      # fine-grained PAT scoped to push to jakebromberg/homebrew-tap.
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    homepage: https://github.com/jakebromberg/code-audit-pipeline
    description: Cross-cutting structural analysis of codebases.
    binaries:
      - code-audit

release:
  github:
    owner: jakebromberg
    name: code-audit-pipeline
  draft: false
  prerelease: auto
