    # cannot be moved by H0b's loosening regardless of curation — H0b's mechanism
    # fires only on primary_match_specifics_* rows. So the maximum possible
    # relative drop against the 119 total denominator is (119-7)/119 = 94.1%.
    # At the threshold cliff: a 50% drop of the 112 addressable rows (56/112)
    # equals 47.1% of the 119 total (56/119) — 2.9pp below the H0b-supported band.
    # The §11 writeup must report BOTH denominators (plan §4 pre-reg commitment).
    addressable_panel_route_floor:
