# Execution-time fields. Pin the model identifier and parameters before
# Phase D launch (§5.3 dry run uses the pinned identifier). Finalize the
# `api_pricing_snapshot` and `trial_date_range` after Phase D completes.
execution:
  # Per §8 decision #2: latest Claude Sonnet 4.6 tier with date-pinned suffix.
  #
  # On 2026-05-14 the Anthropic public models endpoint (/v1/models) exposed
  # only the bare alias `claude-sonnet-4-6` for the 4.6 tier; the comparable
  # 4.5 and 4 tiers expose `claude-sonnet-4-5-20250929` and
  # `claude-sonnet-4-20250514` respectively. Nine candidate date suffixes
  # spanning 2025-08-01 through 2026-04-01 were probed against /v1/messages
  # and all returned HTTP 404 — i.e., no date-pinned 4.6 variant is published
  # for this tier as of the date below. The bare alias is therefore the only
  # available identifier and is what the experiment pins to.
  #
  # Methodology §10's "no silent drift" requirement is enforced by:
  #   1. anthropic-version header (`api_version` below) — the API-shape pin.
  #   2. `primary_pinned_at` records the date the pin decision was made; the
  #      experiment runs against whatever `claude-sonnet-4-6` resolved to
  #      between that date and `trial_date_range.end`.
  #   3. Every Phase D telemetry record captures the `model` field returned
  #      by /v1/messages for that recommendation, so a mid-experiment alias
  #      retarget by Anthropic would be visible post-hoc as a divergence in
  #      the captured ids.
  #
  # If Anthropic publishes a date-pinned 4.6 variant before Phase D starts,
  # repoint `primary` to that id, set `primary_pinned_at` to the publish
  # date, and re-run the §5.3 dry-run to refresh `dry_run_reference` below.
  api_version: "2023-06-01"
  model_versions:
    primary: claude-sonnet-4-6
    primary_pinned_at: "2026-05-14"
    primary_pin_source: /v1/models on 2026-05-14 — only bare alias surfaced for 4.6 tier
    response_model_capture_field: model  # per-rec field in /v1/messages response to record alongside telemetry
  model_parameters:
    temperature: 0.0
    max_tokens: 4096
    top_p: null
    top_k: null
    system_prompt: null  # the agent prompt is the user-turn content; no system role used
  # Pricing snapshot per §5.4 cost projection; rates confirmed in §5.3 dry run
  # (actual cost matched expected to within $0.0001 / rec).
  api_pricing_snapshot:
    captured_at: "2026-05-14"
    claude-sonnet-4-6:
      input_per_mtok_usd: 3.00
      output_per_mtok_usd: 15.00
  # §5.3 dry-run reference numbers; the Phase D harness should observe rec-
  # level variance in this range.
  dry_run_reference:
    query: pat-candidates
    row: 0
    input_tokens: 2735
    output_tokens: 643
    latency_ms: 21259
    cost_usd: 0.01785
    response_category: no-action
    response_reason_class: sample-app-mirror
    response_confidence: 0.82
  trial_date_range:
    start: "2026-05-15T05:07:40Z"
    end: "2026-05-15T14:49:23Z"
  # Sum of per-rec cost_usd across all 2907 trial-log records (3 trials × 444
  # S1 + 3 trials × 525 S2). Well under the §6.3 acceptance hard cap of $120.
  actual_spend_usd: 39.4584
  # Panel sitting per methodology §17 decision #3. The pre-registered design
  # called for 3 internal reviewers scoring the 12 panel-routed recs blind to
  # condition. Round 1 executed with 1 expert reviewer instead (see
  # `round1_deviation` below); the 12 panel scores landed at
  # `analyses/panel-scores.jsonl` and `promote_panel_scores` in score_all.py
  # backfills them into per-cell `best_score` so the headline reflects panel-
  # resolved values. Fleiss κ is undefined for m<2 raters and
  # `analyses/score-summary.json::inter_rater` carries the structured
  # `panel-pending` sentinel `{fleiss_kappa: null, n_raters: 1, note: ...}`
  # until round 2 adds the missing two reviewers.
  panel_composition:
    n_reviewers_planned: 3
    n_reviewers_actual: 1
    recruitment_source: internal
    blind_to_condition: true
    time_commitment_per_reviewer_hours: 4
    target_metric: fleiss_kappa
    target_threshold: 0.4   # methodology §12 "fair agreement" lower bound
    scores_consolidated_at: analyses/panel-scores.jsonl
    per_reviewer_files_at: [analyses/panel-scores-reviewer-1.jsonl]
    instructions_at: analyses/panel-instructions.md
    round1_deviation:
      description: |
        Round 1 was scored by a single expert reviewer rather than the
        pre-registered 3-reviewer panel. The 12 panel-routed recs are heavily
        concentrated on one cluster (HSBColor.uiColor/HSBColor.nsColor near-
        duplicate, Jaccard 0.71), bound to plants 3.1 and 5.1 via substring
        match on source_files. The practical scoring load is closer to two
        distinct judgements (one per plant binding) than 12 independent ones;
        the overhead of recruiting and calibrating two more reviewers for an
        essentially binary call was disproportionate at this corpus size.
      consequence: |
        Fleiss κ is undefined at m<2 and is emitted as a structured panel-
        pending sentinel rather than a numeric value. Per-rec scores are
        still authoritative — auto-scorer.py's panel-route decision rule pre-
        registered the recs that needed human judgement, and this round
        supplies one such judgement per rec. The §14.3 ≤50% panel-route rate
        acceptance check is satisfied by the auto-scorer alone (2.1% S1,
        1.3% S2 — both well under 50%), so the missing inter-rater signal
        does not block headline interpretation.
      remediation:
        round_2_action: recruit 2 additional reviewers to score the same
          analyses/panel-routing.jsonl; concatenate per-reviewer files into
          analyses/panel-scores.jsonl; re-run score_all.py to populate
          inter_rater with a numeric κ and update the headline if any
          panel-resolved value shifts.
        deadline: round 2 panel sitting (no fixed date yet).
    round1_correction:
      description: |
        After PR #82 merged, two round-1 artifacts were corrected in a
        follow-up PR (closeout). A2 — bind_recs_to_plants tightened with a
        prefer-signal-match resolution rule: when a cluster substring-matches
        multiple plants, bind only to those whose expected_substrate_signals
        include the rec's query. A3 — agent prompt rule 1 sub-bullets for
        is_test / is_mock / is_sample_app were rephrased from "all
        participating records have X" to "ANY participating record has X" so
        restraint markers are load-bearing in mixed-marker clusters (the
        canonical restraint pattern).
      consequence: |
        A2: 24 incidental false bindings cleaned (Plant 3.1 -3, 3R -9, 5.1
        -3, 5.3 -9). Headline canonical_recall and panel_routed counts
        unchanged. The Plant 3.1 / 5.1 panel-routed co-binding for the
        HSBColor function-duplicates-near cluster is NOT cleaned up — both
        plants legitimately list function-duplicates in their signals AND
        both have HSBColor.swift in their source_files. The deeper fix
        requires symbol-level matching (new manifest field
        expected_cluster_symbols), filed as round-2 follow-up in the
        closeout plan §6.2.

        A3: round-1 measurable effect is null. The agent already emits
        no-action on Plant 1R's two canonical clusters under the existing
        prompt; Plant 1R's 1.0 per-cell FPR comes from incidental bindings
        (DebugMetricsProvider clusters substring-matching DebugHUD.swift),
        which §6.2's symbol-level fix will also resolve. The prompt edit
        is methodologically correct future-proofing; its measurable effect
        lands in round 2.
      targeted_rerun:
        cancelled: true
        rationale: |
          The plan originally called for a 10-invocation targeted re-run
          against Plant 1R's two canonical clusters under the new prompt.
          Audit of the round-1 raw responses showed the agent already emits
          no-action on those clusters under the OLD prompt — re-running
          validates nothing observable. The prompt change is monotonic in
          the no-action direction (any-vs-all is more permissive), so a
          regression on existing no-action behavior is logically impossible.
      prompt_hash_post_correction: a04a8360e7b514e9836c3035652787c5fb9e4c60fddc2483924dc056fc035c33
      prompt_hash_pre_correction: kept in top-level pre_registration.prompt_hash
    round2_methodology_update:
      description: |
        Round 2 added a per-plant `expected_cluster_symbols` manifest field
        gating bindings on planted-symbol substring membership in cluster_id.
        Validator `validate-manifest.py` rule 9j enforces non-empty list of
        non-empty strings. `bind_recs_to_plants` adds a hard symbol gate
        between substring-match and signal-prefer. Resolves both the panel-
        routed Plant 3.1 / 5.1 co-binding on HSBColor and Plant 1R's
        structural FPR — both were (path, query)-granularity ambiguity
        cases that symbol-level matching disambiguates. Documented as the
        first entry in `rubric-modifications.md` per methodology §10.
      consequence: |
        panel_routed: 12 -> 6 (Plant 3.1 false-binding routings drop;
        Plant 5.1 legitimate routings persist). Plant 1R per-cell FPR:
        1.0 -> 0.0 across all 6 (condition, trial) cells. Headline 1-FPR:
        0.800 -> 1.000 in both conditions. canonical_recall unchanged at
        S1=0.270 / S2=0.615. Plant 1R binding count went 99 -> 30 (not
        the projected ~2 — the "MetricRow" symbol matches more legitimate
        clusters than the plan estimated). All 30 received no-action;
        methodological outcome preserved.
      orphan_panel_scores:
        description: |
          The 6 Plant 3.1 panel scores in panel-scores-reviewer-1.jsonl
          (round 1 scored them as 0.0 false-bindings) no longer map to any
          rec_token in the regenerated panel-routing.jsonl because Plant 3.1
          no longer routes to panel for the HSBColor cluster. The 6 scores
          become orphan tokens. `promote_panel_scores` silently skips them
          (no PANEL_ROUTE entry remains in `scored` to backfill, so the
          continue branch on `by_token.get(token, [])` is a no-op).
          `attach_panel_kappa` and `attach_collapsed_panel_kappa` filter the
          orphan tokens against the in-memory `panel_routed` list and
          surface the orphan count in their respective `note` fields
          (`score-summary.json::inter_rater.note` and `::inter_rater_collapsed.note`).
          Filtering matters because Fleiss κ's precondition is "every item
          rated by exactly m raters" — counting orphans would leave them at
          m=1 (only the round-1 reviewer's score) once round-2 reviewers
          land, silently mis-computing κ. The 6 Plant 5.1 panel scores
          (round 1's 0.3 adjacent-defensible) continue to promote correctly.
      manifest_hash_post_round2: 13b358dd7ba278cbe15bd32412199a7bcbdfb7cd8b710f5ee66a52a26d33b6c9
      manifest_hash_pre_round2: kept in top-level pre_registration.manifest_hash
    round2_methodology_update_value_aware_specifics:
      description: |
        Round 2 added verbatim value comparison to the auto-scorer's primary-
        match path. `auto-scorer.py::score_recommendation` now compares each
        required key's value against `plant.primary_answer.specifics[key]`
        (scalars by ==; lists as multisets; dicts structurally). Value
        mismatches route to panel as `primary_match_specifics_outside_tolerance`;
        missing required keys (previously auto-scored 0.5 as
        `primary_category_wrong_specifics`) now route to panel as
        `primary_match_specifics_missing_keys`. Methodology §8 lines 626-631
        is the citation: "category matches but specifics fall outside
        tolerance" routes to panel; the auto-scorer's role is binary
        tolerance detection, not flag evaluation. The plant's `specifics_tolerance`
        flags are surfaced as `tolerance_flag: <key>=<value>` panel-routing
        notes (panel guidance, not scorer inputs). Documented as the second
        round-2 entry in `rubric-modifications.md` per methodology §10;
        resolves issue #35.
      consequence: |
        panel_routed: 6 -> 108 (37 primary_match_full + 65
        primary_match_weak_rationale + existing 6 other-routes-to-panel all
        flip; 100% of the 102-row primary-match pool had at least one
        mismatched required value). Mismatch classification: 95.1% substantive
        (different identifier, target package, or missing constraint), 4.9%
        trivial (parenthetical commentary, all on Plant 3.4). headline
        canonical_recall: S1 0.270 -> 0.070; S2 0.615 -> 0.110. 1-FPR:
        unchanged at 1.000 in both conditions (restraint plants don't go
        through the primary-match path). panel_route_rate: S1 1.6% -> 13.5%;
        S2 0.9% -> 24.9% (still below the §14.3 50% acceptance bar).
        Methodological correction, not regression: the round-2 binding-only
        baseline was over-credit on value mismatches per §8 routing rules.
      pre_implementation_projection:
        ran_date: 2026-05-19
        gate_threshold_trivial_pct: 30.0
        observed_trivial_pct: 4.9
        gate_outcome: PROCEED
        script: temporary /tmp/v7-project-value-mismatches.py (not committed)
        decision_log: |
          Projection classified each (1.0 + 0.5-weak) row's flip as
          substantive vs trivial. Trivial 4.9% << 30% threshold -> proceeded
          with implementation. Substantive 95.1% confirms the methodological
          correction is load-bearing (agents really do pick wrong specifics
          values on substrate-helped clusters; round-1 key-only matching
          masked this).
      auto_scorer_sha256_post_round2: 013e85777b2e80be70cd4abd347fac5f4c1a3bb69b190edd51cf70959965bc90
      rubric_hash_post_round2_value_aware: 279027861301000e399624099de8c61f63f3117dfbfc203f2f18fa1c20cf730c
      rubric_hash_pre_round2_value_aware: kept in top-level pre_registration.rubric_hash
      issue_link: https://github.com/jakebromberg/code-audit-pipeline/issues/35
    round2_methodology_update_cluster_lens:
      description: |
        Round 2 added an explicit `cluster_lens` field to plants that share
        a substrate cluster with another plant of a different `category`
        (cross-lens cluster-sharing). Plants 3R and 5R migrated to declare
        `cluster_lens: default-implementation` and `cluster_lens:
        generic-parameterization` respectively. The validator (`validate-
        manifest.py` rule 11) enforces value enum, sharing-group presence,
        and sharing-group uniqueness. The auto-scorer's binding layer
        (`score_all.py::bind_recs_to_plants`) applies a new post-filter
        `_apply_cluster_lens_routing` that narrows the candidate plant list
        to exactly the one whose lens matches the rec's `category` for
        action recs in-lens, or falls through to round-1 fan-out (no-action,
        outside-lens, undeclared-lens). Methodology §9 rewritten to
        supersede the round-1 cross-lens FPR-inflation caveat with the
        structural routing rule. Documented as the third round-2 entry in
        `rubric-modifications.md` per methodology §10; resolves issue #33.
      consequence: |
        No scored-row movement on round-1 data because all 45 currently-
        bound 3R+5R rows are `no-action` recs that bypass the lens filter
        per the §9 restraint-table-dominates branch. `auto-scores.json`
        byte-diff vs PR #90 is empty. headline canonical_recall (S1 0.070,
        S2 0.110), 1-FPR (1.000, 1.000), and panel_routed.size (108) all
        unchanged. The structural change matters for round 2 if/when
        action-category recs land against the shared cluster — those would
        attribute to a single plant (the matching-lens one) instead of
        inflating the FPR by binding both. Round-1 results stand as
        documented in results.md; round 2 fixes the rule going forward.
      sharing_group_audit: |
        The validator's `_sharing_groups` heuristic (source_files ∩ +
        expected_cluster_symbols ∩ + distinct category) surfaced one
        cross-lens pair (3R/5R, both declaring `cluster_lens` post-
        migration) and zero unflagged candidates in the full 25-plant
        manifest. The heuristic also surfaced a same-category sharing
        pair (Plants 2.3/2.4 — both protocol-inheritance on overlapping
        AudioPlayerProtocol clusters), correctly excluded by condition
        (3) of `_sharing_groups`. Same-category cluster-sharing is a
        separate manifest-design concern outside #33's scope; handled
        by the auto-scorer's existing per-plant independent scoring.
      manifest_hash_post_round2_cluster_lens: db181ca45b4253c5faa26e7372d4ed04c757a6cdeb8b94bc8dbef9485f612e8c
      score_all_sha256_post_round2_cluster_lens: 6a4a52c98257a4f13dd95438be1b3e2c76044470470028e8d0dd7f5db3d410db
      validate_manifest_sha256_post_round2_cluster_lens: 6b5a39a1ffc9cddd45ab42aabb5e1ada3f4a477b899c279c4a50d87abbe8bbc5
      auto_scorer_sha256_unchanged: 013e85777b2e80be70cd4abd347fac5f4c1a3bb69b190edd51cf70959965bc90
      issue_link: https://github.com/jakebromberg/code-audit-pipeline/issues/33
  # Round-3 sub-experiment per plans/v7-round2-prompt-sensitivity-plan.md.
  # Tests H1 (prompt vagueness) vs H0a (model capability ceiling) for the
  # 94.4% panel-route rate observed under round-2's value-aware specifics
  # matching (PR #90). Single variable: prompt v2 vs prompt v1 (byte-identical
  # §1; §2 sharpened structural constraints; §2.1 added non-corpus worked
