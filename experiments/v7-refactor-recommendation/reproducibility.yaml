# Execution-time fields. Pin the model identifier and parameters before
# Phase D launch (§5.3 dry run uses the pinned identifier). Finalize the
# `api_pricing_snapshot` and `trial_date_range` after Phase D completes.
execution:
  # Per §8 decision #2: latest Claude Sonnet 4.6 tier with date-pinned suffix.
  #
  # On 2026-05-14 the Anthropic public models endpoint (/v1/models) exposed
  # only the bare alias `claude-sonnet-4-6` for the 4.6 tier; the comparable
  # 4.5 and 4 tiers expose `claude-sonnet-4-5-20250929` and
  # `claude-sonnet-4-20250514` respectively. Nine candidate date suffixes
  # spanning 2025-08-01 through 2026-04-01 were probed against /v1/messages
  # and all returned HTTP 404 — i.e., no date-pinned 4.6 variant is published
  # for this tier as of the date below. The bare alias is therefore the only
  # available identifier and is what the experiment pins to.
  #
  # Methodology §10's "no silent drift" requirement is enforced by:
  #   1. anthropic-version header (`api_version` below) — the API-shape pin.
  #   2. `primary_pinned_at` records the date the pin decision was made; the
  #      experiment runs against whatever `claude-sonnet-4-6` resolved to
  #      between that date and `trial_date_range.end`.
  #   3. Every Phase D telemetry record captures the `model` field returned
  #      by /v1/messages for that recommendation, so a mid-experiment alias
  #      retarget by Anthropic would be visible post-hoc as a divergence in
  #      the captured ids.
  #
  # If Anthropic publishes a date-pinned 4.6 variant before Phase D starts,
  # repoint `primary` to that id, set `primary_pinned_at` to the publish
  # date, and re-run the §5.3 dry-run to refresh `dry_run_reference` below.
  api_version: "2023-06-01"
  model_versions:
    primary: claude-sonnet-4-6
    primary_pinned_at: "2026-05-14"
    primary_pin_source: /v1/models on 2026-05-14 — only bare alias surfaced for 4.6 tier
    response_model_capture_field: model  # per-rec field in /v1/messages response to record alongside telemetry
  model_parameters:
    temperature: 0.0
    max_tokens: 4096
    top_p: null
    top_k: null
    system_prompt: null  # the agent prompt is the user-turn content; no system role used
  # Pricing snapshot per §5.4 cost projection; rates confirmed in §5.3 dry run
  # (actual cost matched expected to within $0.0001 / rec).
  api_pricing_snapshot:
    captured_at: "2026-05-14"
    claude-sonnet-4-6:
      input_per_mtok_usd: 3.00
      output_per_mtok_usd: 15.00
  # §5.3 dry-run reference numbers; the Phase D harness should observe rec-
  # level variance in this range.
  dry_run_reference:
    query: pat-candidates
    row: 0
    input_tokens: 2735
    output_tokens: 643
    latency_ms: 21259
    cost_usd: 0.01785
    response_category: no-action
    response_reason_class: sample-app-mirror
    response_confidence: 0.82
  trial_date_range:
    start: "2026-05-15T05:07:40Z"
    end: "2026-05-15T14:49:23Z"
  # Sum of per-rec cost_usd across all 2907 trial-log records (3 trials × 444
  # S1 + 3 trials × 525 S2). Well under the §6.3 acceptance hard cap of $120.
  actual_spend_usd: 39.4584
  # Panel sitting per methodology §17 decision #3. The pre-registered design
  # called for 3 internal reviewers scoring the 12 panel-routed recs blind to
  # condition. Round 1 executed with 1 expert reviewer instead (see
  # `round1_deviation` below); the 12 panel scores landed at
  # `analyses/panel-scores.jsonl` and `promote_panel_scores` in score_all.py
  # backfills them into per-cell `best_score` so the headline reflects panel-
  # resolved values. Fleiss κ is undefined for m<2 raters and
  # `analyses/score-summary.json::inter_rater` carries the structured
  # `panel-pending` sentinel `{fleiss_kappa: null, n_raters: 1, note: ...}`
  # until round 2 adds the missing two reviewers.
  panel_composition:
    n_reviewers_planned: 3
    n_reviewers_actual: 1
    recruitment_source: internal
    blind_to_condition: true
    time_commitment_per_reviewer_hours: 4
    target_metric: fleiss_kappa
    target_threshold: 0.4   # methodology §12 "fair agreement" lower bound
    scores_consolidated_at: analyses/panel-scores.jsonl
    per_reviewer_files_at: [analyses/panel-scores-reviewer-1.jsonl]
    instructions_at: analyses/panel-instructions.md
    round1_deviation:
      description: |
        Round 1 was scored by a single expert reviewer rather than the
        pre-registered 3-reviewer panel. The 12 panel-routed recs are heavily
        concentrated on one cluster (HSBColor.uiColor/HSBColor.nsColor near-
        duplicate, Jaccard 0.71), bound to plants 3.1 and 5.1 via substring
        match on source_files. The practical scoring load is closer to two
        distinct judgements (one per plant binding) than 12 independent ones;
        the overhead of recruiting and calibrating two more reviewers for an
        essentially binary call was disproportionate at this corpus size.
      consequence: |
        Fleiss κ is undefined at m<2 and is emitted as a structured panel-
        pending sentinel rather than a numeric value. Per-rec scores are
        still authoritative — auto-scorer.py's panel-route decision rule pre-
        registered the recs that needed human judgement, and this round
        supplies one such judgement per rec. The §14.3 ≤50% panel-route rate
        acceptance check is satisfied by the auto-scorer alone (2.1% S1,
        1.3% S2 — both well under 50%), so the missing inter-rater signal
        does not block headline interpretation.
      remediation:
        round_2_action: recruit 2 additional reviewers to score the same
          analyses/panel-routing.jsonl; concatenate per-reviewer files into
          analyses/panel-scores.jsonl; re-run score_all.py to populate
          inter_rater with a numeric κ and update the headline if any
          panel-resolved value shifts.
        deadline: round 2 panel sitting (no fixed date yet).
  rubric_modifications: null  # round 1: no post-hoc rubric edits
