      - "WXYC/iOS/NowPlayingWidget/Extensions.swift"                    # ext SwiftUI.Image @ line 27
    synthesis: none
    planted_extras: 0
    restraint: false
    cross_layer: true  # both files in app target layers (app:WatchXYC, app:iOS); lift target must be upstream of both
    expected_substrate_signals:
      - exact-duplicates
      - cross-package-shape-near-duplicates-any
    expected_cluster_symbols:
      - SwiftUI.Image.background
      - SwiftUI.Image
    primary_answer:
      category: extract-to-common
      specifics:
        target_package: "Shared/UI or a new Shared/Branding (must be upstream of both app:WatchXYC and app:iOS)"
        type_name: "Image+Branding (extension on SwiftUI.Image)"
        remove_from:
          - "WXYC/WatchXYC/PlayerPage.swift"
          - "WXYC/iOS/NowPlayingWidget/Extensions.swift"
      rationale_must_cite:
        - "SwiftUI.Image"
        - "logo"
        - "background"
        - "same shape"
    specifics_tolerance:
      target_package_must_be_upstream_of_all_consumers: true
      target_must_be_upstream_of_both_layers: true  # cross-layer plant
    alternative_answers:
      - category: extract-to-common
        weight: 0.7
        note: "Naming an existing Shared/* package like Shared/Core as target instead of a new Shared/Branding is defensible if it's already an upstream dep of both app targets."
    wrong_answers:
      - category: no-action
        note: "Two identical SwiftUI.Image extensions across two app targets with no test/codegen markers is a clear extract candidate; no-action is a false negative."
      - category: subclass-lift
        note: "Extensions on a struct (SwiftUI.Image) cannot be subclassed; would be a Swift-level error."

