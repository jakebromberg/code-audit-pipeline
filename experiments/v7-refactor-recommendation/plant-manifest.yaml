# V7 plant manifest — wxyc-ios-64
#
# Phase A.2 deliverable per `plans/v7-refactor-recommendation-implementation-plan.md` §2.2: name 25 source types
# with file paths. Phase A.3 expands each entry with the rubric/expected-answer fields per plan §2.3 and
# `docs/refactor-recommendation-experiment-plant-manifest.md`.
#
# Candidate enumeration and rationale: `experiments/v7-refactor-recommendation/plant-source-candidates.md`.
# Substrate snapshot used for selection: `/tmp/wxyc-ios-audit-planted/` (captured 2026-05-11).
# Path validation + rubric-field validation: `experiments/v7-refactor-recommendation/validate-manifest.py`.
#
# Phase A.2 schema:
#   plant_id          — §5 numbering from methodology
#   category          — one of {extract-to-common, protocol-inheritance, default-implementation,
#                                pat-introduction, generic-parameterization}
#   source_type       — real wxyc-ios-64 declaration (or "synthesized: ..." with parallel-pattern note)
#   source_files      — file paths the plant derives from. Real-substrate paths reference existing files in
#                       wxyc-ios-64; `_Plant_*.swift` paths are planted-companion files added by Phase C.
#   synthesis         — none | full | hybrid
#                         none   — every source_file references a real declaration in the substrate
#                         full   — the entire source pair/triple is synthesized (no real anchor)
#                         hybrid — real anchor pair/triple + one or more `_Plant_*.swift` companions added
#                                  to satisfy a cardinality constraint (e.g., Cat 3's "≥3 conformers")
#   planted_extras    — for hybrid plants, count of `_Plant_*.swift` companions added (otherwise 0)
#   generic_kind      — for Cat. 5 only: function | struct, identifying which generic-parameterization shape
#                       the plant targets (the methodology requires ~3 function + ~2 struct across Cat. 5)
#   cross_layer       — optional bool. True when the source pair spans an app target layer (e.g., app:iOS,
#                       app:WatchXYC) and a Shared/ package; flags lift-target ambiguity for the §2.5 reviewer
#                       (the lift target must be upstream of both layers). Omitted when both source files live
#                       in the same layer.
#   restraint         — true for restraint twins (correct answer is no-action)
#   restraint_pair    — for restraints, the canonical plant_id whose shape it mirrors
#   restraint_signal  — for restraints, the context flag that distinguishes it from the canonical
#
# Phase A.3 schema (per `docs/refactor-recommendation-experiment-plant-manifest.md` and methodology §8 rubric):
#   expected_substrate_signals  — non-empty list of query names the plant should surface in
#   expected_cluster_symbols    — round-2 binding-artifact v2 (#86): non-empty list of non-empty literal
#                                 substrings the cluster_id MUST contain for a (rec, plant) binding to be
#                                 admitted. Acts as a hard gate between substring-match (on source_files)
#                                 and signal-prefer (on expected_substrate_signals) in
#                                 `score_all.py::bind_recs_to_plants`. Disambiguates plants that share a
#                                 source_file but plant different symbol shapes (Plant 3.1 vs 5.1 on
#                                 HSBColor.swift), and blocks incidental bindings where the cluster
#                                 substring-matches a source_file but doesn't surface the plant's symbol
#                                 (Plant 1R's DebugHUD.swift / DebugMetricsProvider bindings). Validator
#                                 rule 9j enforces non-empty list of non-empty strings.
#   primary_answer
#     category                  — one of CATEGORIES ∪ {"no-action"} (no-action iff restraint=true)
#     specifics                 — non-empty dict matching the per-category schema in
#                                 `refactor-recommendation-experiment-agent-prompt.md` §2
#     rationale_must_cite       — non-empty list of substrings the rationale must include (symbol names,
#                                 package names, semantic keywords)
#     specifics_alternatives    — round-4 H0b (optional): dict[str, list[str]] mapping a key in
#                                 `specifics` to up to 3 pre-blessed alternative values that should also
#                                 auto-score 1.0 under `primary_match_specifics_blessed_alternative`.
#                                 Per `plans/v7-h0b-rubric-loosening-plan.md` §3.1–§3.2: cap 3 per
#                                 (plant, key); no entry may equal the canonical value; no in-list
#                                 duplicates; curation per the three-criteria rubric in
#                                 `h0b-curation-rubric.md`. Validator rule 12 enforces shape.
#     specifics_alternatives_rationale — round-4 H0b (optional, required when alternatives are declared):
#                                 dict[str, list[str]] parallel to `specifics_alternatives`. Each list
#                                 has the same length as the corresponding alternatives list; each entry
#                                 is a one-sentence manifest-grounded justification (no agent-output
#                                 references per criterion (c) blindness).
#   specifics_tolerance         — dict of boolean tolerance flags for auto-scoring (may be empty)
#   alternative_answers         — list (possibly empty) of {category, weight∈[0,1], note}
#   wrong_answers               — non-empty list of {category, note}; always include `no-action` for canonicals
#                                 and the canonical's category for restraints

plants:
