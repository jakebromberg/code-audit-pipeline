# V7 plant manifest — wxyc-ios-64
#
# Phase A.2 deliverable per `plans/v7-refactor-recommendation-implementation-plan.md` §2.2: name 25 source types
# with file paths. Full per-plant expansion (expected_substrate_signals, primary_answer, alternative_answers,
# wrong_answers, specifics_tolerance, rationale_must_cite) is Phase A.3 — see plan §2.3.
#
# Candidate enumeration and rationale: `experiments/v7-refactor-recommendation/plant-source-candidates.md`.
# Substrate snapshot used for selection: `/tmp/wxyc-ios-audit-planted/` (captured 2026-05-11).
# Path validation: `experiments/v7-refactor-recommendation/validate-manifest.mjs` (cross-checks every non-synthesized
# source_file against the catalog).
#
# Schema for these initial entries:
#   plant_id          — §5 numbering from methodology
#   category          — one of {extract-to-common, protocol-inheritance, default-implementation,
#                                pat-introduction, generic-parameterization}
#   source_type       — real wxyc-ios-64 declaration (or "synthesized: ..." with parallel-pattern note)
#   source_files      — file paths the plant derives from. Real-substrate paths reference existing files in
#                       wxyc-ios-64; `_Plant_*.swift` paths are planted-companion files added by Phase C.
#   synthesis         — none | full | hybrid
#                         none   — every source_file references a real declaration in the substrate
#                         full   — the entire source pair/triple is synthesized (no real anchor)
#                         hybrid — real anchor pair/triple + one or more `_Plant_*.swift` companions added
#                                  to satisfy a cardinality constraint (e.g., Cat 3's "≥3 conformers")
#   planted_extras    — for hybrid plants, count of `_Plant_*.swift` companions added (otherwise 0)
#   generic_kind      — for Cat. 5 only: function | struct, identifying which generic-parameterization shape
#                       the plant targets (the methodology requires ~3 function + ~2 struct across Cat. 5)
#   cross_layer       — optional bool. True when the source pair spans an app target layer (e.g., app:iOS,
#                       app:WatchXYC) and a Shared/ package; flags lift-target ambiguity for the §2.5 reviewer
#                       (the lift target must be upstream of both layers). Omitted when both source files live
#                       in the same layer.
#   restraint         — true for restraint twins (correct answer is no-action)
#   restraint_pair    — for restraints, the canonical plant_id whose shape it mirrors
#   restraint_signal  — for restraints, the context flag that distinguishes it from the canonical
#
# Phase A.3 will add the rubric/expected-answer fields documented in
# `docs/refactor-recommendation-experiment-plant-manifest.md`.

