# manifest.toml — registration sidecar for the Python extractor.
#
# Read by the `code-audit` binary (per ADR-0002) to discover this extractor's
# identity, runtime prerequisites, and per-catalog invocation contract.
#
# Token grammar in `invocation`:
#   {root}            required positional, audited repo root
#   {output}          target file under .audit/catalogs/<output_file>
#   {shared}          secondary package root
#   {touched}         path to the JSON array of touched-in-window files
#   {min_body_lines}  function-catalog-only threshold knob
#
# Stdlib-only: no bootstrap step. The extractor uses Python's `ast` module.

schema_version = 2

[extractor]
name = "python"
language = "python"
version = "0.1.0"
description = "Python AST extractor (stdlib ast); emits type and function catalogs."

[[command]]
catalog = "type-catalog"
output_file = "type-catalog.json"
invocation = ["python3", "type_catalog.py", "--root", "{root}", "--output", "{output}"]
optional_args = [
  { flag = "--shared", placeholder = "{shared}", when = "shared_set" },
  { flag = "--touched", placeholder = "{touched}", when = "touched_set" },
]

[[command]]
catalog = "function-catalog"
output_file = "function-catalog.json"
invocation = ["python3", "function_catalog.py", "--root", "{root}", "--output", "{output}"]
optional_args = [
  { flag = "--shared", placeholder = "{shared}", when = "shared_set" },
  { flag = "--touched", placeholder = "{touched}", when = "touched_set" },
  { flag = "--min-body-lines", placeholder = "{min_body_lines}", when = "min_body_lines_set" },
]

[runtime]
requires = ["python >= 3.9"]
setup_hint = "No additional setup — uses Python stdlib only (ast.unparse requires 3.9+)."
