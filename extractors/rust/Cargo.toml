# rust-catalog — syn-based Rust AST extractor for the code-audit-pipeline.
#
# Standalone binary crate (NOT a member of any workspace) so the audited
# repo's own workspace never sees it. The `code-audit` binary lays this tree
# down and runs `[runtime].bootstrap` (`cargo build --release`) once, then
# invokes `cargo run --release -- type ...` per the manifest.
#
# See ../../docs/pipeline-contract.md for the emitted schema.
[package]
name = "rust-catalog"
version = "0.1.0"
edition = "2021"
rust-version = "1.93"
publish = false

[[bin]]
name = "rust-catalog"
path = "src/main.rs"

[lib]
name = "rust_catalog"
path = "src/lib.rs"

[dependencies]
syn = { version = "2", features = ["full", "visit", "extra-traits"] }
quote = "1"
# span-locations: makes `Span::start().line` return real 1-indexed line
# numbers when parsing from a source string (fallback mode), not 0.
proc-macro2 = { version = "1", features = ["span-locations"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"

[profile.release]
# Favor fast compile (bootstrap latency) over runtime micro-optimization —
# the extractor is I/O- and parse-bound, not compute-bound.
opt-level = 1
